services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vigira}
      POSTGRES_USER: ${POSTGRES_USER:-vigira}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vigira}
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vigira} -d ${POSTGRES_DB:-vigira}"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
