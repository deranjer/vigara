services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env.staging
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    image: ${VIGARA_IMAGE:-ghcr.io/deranjer/vigara:staging}
    restart: unless-stopped
    env_file: .env.staging
    environment:
      VIGARA_ADDR: ":8080"
      VIGARA_DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable"
      VIGARA_AGENT_RELEASE_TAG: ${VIGARA_AGENT_RELEASE_TAG:-auto}
      VIGARA_AGENT_RELEASE_CACHE: /var/lib/vigira/agent-releases
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${VIGARA_PORT:-8080}:8080"
    volumes:
      - android-backups:/var/lib/vigira/android-backups
      - agent-releases:/var/lib/vigira/agent-releases

volumes:
  postgres-data:
  android-backups:
  agent-releases:
