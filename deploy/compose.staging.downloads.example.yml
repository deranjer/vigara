services:
  app:
    environment:
      VIGARA_AGENT_RELEASE_DIR: /opt/vigira/releases
      VIGARA_PUBLIC_URL: ${VIGARA_PUBLIC_URL:?Set VIGARA_PUBLIC_URL to the public HTTPS base URL}
    volumes:
      - type: bind
        source: ${VIGARA_AGENT_RELEASE_HOST_DIR:?Set VIGARA_AGENT_RELEASE_HOST_DIR to the release directory}
        target: /opt/vigira/releases
        read_only: true
        bind:
          create_host_path: false
