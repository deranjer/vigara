networks:
  proxy:
    # Must already exist and be shared with caddy-docker-proxy.
    name: ${VIGARA_PROXY_NETWORK:-web}
    external: true
  backend:
    internal: true

services:
  app:
    image: ${VIGARA_IMAGE:-ghcr.io/deranjer/vigara:staging}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - proxy
      - backend
    environment:
      VIGARA_ADDR: :8080
      VIGARA_DATABASE_URL: postgres://vigara:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/vigara?sslmode=disable
      VIGARA_COOKIE_SECURE: "true"
      VIGARA_MCP_URL: ${VIGARA_MCP_URL:-}
      VIGARA_PUBLIC_URL: ${VIGARA_PUBLIC_URL:-}
      VIGARA_AGENT_RELEASE_TAG: ${VIGARA_AGENT_RELEASE_TAG:-auto}
      VIGARA_AGENT_RELEASE_CACHE: /var/lib/vigira/agent-releases
    volumes:
      - agent-releases:/var/lib/vigira/agent-releases
    # Caddy connects over the proxy network; no host port is published.
    labels:
      caddy: ${VIGARA_DOMAIN:?Set VIGARA_DOMAIN to your public hostname}
      caddy.reverse_proxy: "{{upstreams 8080}}"
      caddy_ingress_network: ${VIGARA_PROXY_NETWORK:-web}
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    networks:
      - backend
    environment:
      POSTGRES_USER: vigara
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: vigara
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vigara -d vigara"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  agent-releases:

