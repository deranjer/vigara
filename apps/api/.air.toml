root = "."
tmp_dir = ".cache/air"

[build]
cmd = "go build -o ./.cache/bin/vigira ./apps/api/cmd/vigira"
bin = ".cache/bin/vigira"
include_ext = ["go", "sql", "html", "css", "js"]
exclude_dir = [".git", ".cache", "node_modules", "vendor", "apps/web/node_modules", "apps/web/dist"]
exclude_regex = ["_test.go"]
delay = 500
stop_on_error = true
send_interrupt = true
kill_delay = 500

[log]
time = true

[color]
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"

[misc]
clean_on_exit = true
