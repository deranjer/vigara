apiVersion: vigara.io/v1
kind: DeploymentAssignment
assignmentId: hello-web-home-north
stackId: hello-web
profileId: home-north
environment: production
ownership:
  mode: stateless
  ownershipEpoch: 1
replicaKey: home-north
projectNameOverride: hello-web-north
interpolationFiles:
  - path: secrets/assignments/hello-web-home-north.env.sops
    purpose: deployment
    sensitivity: encrypted
secretRecipientRefs:
  - class: central-editor
    keyRef: editor-main
  - class: target-agent
    keyRef: home-north-agent
  - class: operator-recovery
    keyRef: offline-recovery-a
enabled: true
