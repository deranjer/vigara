apiVersion: vigara.io/v1
kind: Stack
stackId: hello-web
displayName: Hello web
projectName: hello-web
compose:
  files:
    - compose.yaml
  projectDirectory: .
  interpolationFiles:
    - path: secrets/runtime.env.sops
      purpose: stack
      sensitivity: encrypted
configurationRevisionPolicy: sha256-canonical-manifest-and-referenced-files-v1
secretRecipientRefs:
  - class: central-editor
    keyRef: editor-main
  - class: target-agent
    keyRef: enrolled-agent-identity
  - class: operator-recovery
    keyRef: offline-recovery-a
notes: Single-app illustrative stack. The referenced SOPS file is intentionally not included; no key or secret is part of this example.
