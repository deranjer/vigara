name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vigira_test
          POSTGRES_USER: vigira
          POSTGRES_PASSWORD: vigira_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vigira -d vigira_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      VIGIRA_TEST_DATABASE_URL: postgres://vigira:vigira_test@localhost:5432/vigira_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go build ./apps/api/... ./apps/agent/...
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
