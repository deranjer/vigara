name: Mobile Android Release APK

# Builds the signed Vigara mobile APK and attaches it to a GitHub release named after the tag, so the
# self-hosted F-Droid repo (deranjer/fdroid) can pick it up. Tag format: android-vX.Y.Z
# (kept separate from the server's v* container tags and the agents-sha-* releases).
on:
  push:
    tags: ['android-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, for example android-v0.1.0
        required: true

permissions:
  contents: write

concurrency:
  group: mobile-android-release
  cancel-in-progress: false

jobs:
  build:
    name: Build and attach signed APK
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Derive versionName and versionCode from the tag
        id: ver
        run: |
          V="${TAG#android-v}"
          IFS=. read -r MA MI PA <<< "$V"
          PA=${PA%%-*}
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "code=$((MA * 10000 + MI * 100 + PA))" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Assemble signed release APK
        working-directory: apps/mobile
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PversionName="${{ steps.ver.outputs.name }}" \
            -PversionCode="${{ steps.ver.outputs.code }}"

      - name: Attach APK to the release
        run: |
          APK="vigara-mobile-${{ steps.ver.outputs.name }}.apk"
          cp apps/mobile/app/build/outputs/apk/release/app-release.apk "$APK"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Vigara mobile ${{ steps.ver.outputs.name }}" \
              --notes "Android client for Vigara. Install through the F-Droid repo or sideload this APK." \
              --prerelease --latest=false
          fi
          gh release upload "$TAG" "$APK" --clobber
